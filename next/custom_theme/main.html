{% extends "base.html" %}

{# Beacon semantic search (Mirantis) — see https://github.com/Mirantis/beacon #}
{% block extrahead %}
  {{ super() }}
  <style>
    /* Keep the trigger compact inside the Material header flex row */
    .md-header beacon-search {
      flex: 0 1 14rem;
      margin-inline-start: auto;
      margin-inline-end: 0.4rem;
      align-self: center;
      /*
       * Beacon uses shadow DOM + `color: inherit` on the search input. The header
       * theme uses light text; that `color` is inherited onto the host and into the
       * shadow tree, so typed text was invisible on the white modal. Fix via host.
       */
      color: rgb(17, 24, 39) !important;
    }
    @media (max-width: 959px) {
      .md-header beacon-search {
        display: none;
      }
    }
  </style>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script type="module">
    const BEACON_WIDGET = "https://widget.main.beacon.us2.amazee.io/beacon.js";
    const BEACON_API = "https://search-api.main.beacon.us2.amazee.io";

    async function mountBeaconSearch() {
      const headerInner = document.querySelector(".md-header .md-header__inner.md-grid");
      if (!headerInner || headerInner.querySelector("beacon-search")) {
        return;
      }
      await import(BEACON_WIDGET);
      const el = document.createElement("beacon-search");
      el.setAttribute("api-url", BEACON_API);
      el.setAttribute("product", "k0rdent");
      el.setAttribute("placeholder", "Semantic search…");
      headerInner.appendChild(el);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", mountBeaconSearch, { once: true });
    } else {
      mountBeaconSearch();
    }
  </script>
{% endblock %}
